name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pytest ruff google-cloud-firestore google-cloud-storage google-auth requests
      - name: Ruff
        run: ruff check ingest tests local_test.py conftest.py agents/attest_orchestrator/
      - name: Pytest
        run: pytest -q